spring:
  application:
    name: military-api

  # Підключення до PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/military_db
    username: military_user  # <--- ВИПРАВЛЕНО (було postgres)
    password: military_pass  # <--- ВИПРАВЛЕНО (було password)
    driver-class-name: org.postgresql.Driver

  # Налаштування JPA та Hibernate
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Налаштування Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  # Підключення до Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000

  # Налаштування кешу
  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always

